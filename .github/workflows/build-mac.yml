# macOS release builds. electron-builder cannot cross-compile DMGs on
# Windows, so mac installers are produced here on GitHub's hosted runners
# (free for public repos).
#
# Builds are ad-hoc signed (scripts/after-pack.cjs), not Developer ID signed
# or notarized — no Apple Developer certificate is configured. To sign +
# notarize, add the CSC_LINK / APPLE_API_* secrets listed in DISTRIBUTION.md
# and drop the CSC_IDENTITY_AUTO_DISCOVERY override below.
#
# Runs automatically on v* tags (attaches the DMG/ZIPs to that release) and
# manually via workflow_dispatch (optional tag input attaches to an existing
# release; leave it empty to just produce build artifacts).

name: Build macOS installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the builds to (e.g. v1.0.3). Empty = artifacts only.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    # macos-14 was retired by GitHub (runs were cancelled as "not supported");
    # latest survives the next retirement too.
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.ref_name) || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron main
        run: npm run build
        env:
          # ByTune's Supabase project, kept out of the source (scripts/build-main.mjs).
          # BYTUNE_RELEASE makes the build fail rather than ship without accounts.
          BYTUNE_SUPABASE_URL: ${{ secrets.BYTUNE_SUPABASE_URL }}
          BYTUNE_SUPABASE_KEY: ${{ secrets.BYTUNE_SUPABASE_KEY }}
          BYTUNE_RELEASE: "1"

      - name: Package ZIP installers (guaranteed)
        # ZIP targets have proven reliable on CI; DMGs are attempted
        # separately as best effort. Per-arch invocations keep the hdiutil
        # volume handling single-threaded.
        run: |
          npx electron-builder --mac zip --arm64 --publish never
          npx electron-builder --mac zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package DMG installers (best effort)
        # hdiutil attach/detach on GitHub's macOS images is flaky ("detach
        # ... Resource busy"); a DMG failure must not sink the ZIP release.
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          npx electron-builder --mac dmg --arm64 --publish never || true
          npx electron-builder --mac dmg --x64 --publish never || true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify signatures and minimum macOS
        # Checks the apps exactly as users receive them. A missing or broken
        # bundle seal is the "ByTune is damaged" dead end on download, and an
        # LSMinimumSystemVersion below the binaries' real floor lets the app
        # install on Macs where it can never launch.
        run: |
          set -euo pipefail
          ver() { awk -F. '{ printf "%d%03d%03d\n", $1, $2, $3 }' <<< "$1"; }
          check() {
            codesign --verify --deep --strict --verbose=2 "$1"
            codesign -dv "$1" 2>&1 | grep -E "^(Identifier|Signature|Sealed Resources)" || true
            spctl --assess --type execute -vv "$1" 2>&1 || true
            need=$(vtool -show-build "$1/Contents/MacOS/ByTune" | awk '/minos/ {print $2; exit}')
            have=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$1/Contents/Info.plist")
            echo "binaries need macOS $need, Info.plist declares $have"
            if [ "$(ver "$have")" -lt "$(ver "$need")" ]; then
              echo "::error::LSMinimumSystemVersion $have is below the binaries' minimum $need"
              exit 1
            fi
          }
          for zip in release/*.zip; do
            echo "== $zip"
            dir=$(mktemp -d)
            ditto -x -k "$zip" "$dir"
            check "$dir/ByTune.app"
          done
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "== $dmg"
            mnt=$(mktemp -d)
            # hdiutil is flaky on these runners; an unmountable DMG is skipped,
            # a mounted one must pass.
            if hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null; then
              check "$mnt/ByTune.app"
              hdiutil detach "$mnt" >/dev/null || true
            else
              echo "::warning::could not mount $dmg to verify it"
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" release/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          # DMGs only exist when the flaky hdiutil stage happened to succeed.
          shopt -s nullglob
          dmgs=(release/*.dmg)
          if [ ${#dmgs[@]} -gt 0 ]; then
            gh release upload "$TAG" "${dmgs[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          fi
