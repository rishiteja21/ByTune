# macOS release builds. electron-builder cannot cross-compile DMGs on
# Windows, so mac installers are produced here on GitHub's hosted runners
# (free for public repos).
#
# Builds are UNSIGNED — no Apple Developer certificate is configured. To
# sign + notarize, add the CSC_LINK / APPLE_API_* secrets listed in
# DISTRIBUTION.md and drop the CSC_IDENTITY_AUTO_DISCOVERY override below.
#
# Runs automatically on v* tags (attaches the DMG/ZIPs to that release) and
# manually via workflow_dispatch (optional tag input attaches to an existing
# release; leave it empty to just produce build artifacts).

name: Build macOS installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the builds to (e.g. v1.0.3). Empty = artifacts only.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.ref_name) || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron main
        run: npm run build

      - name: Package arm64 DMG + ZIP
        # Sequential arch invocations: building both arches' DMGs in parallel
        # makes the two hdiutil mounts collide ("hdiutil detach" failure).
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package x64 DMG + ZIP
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" release/*.dmg release/*.zip --clobber --repo "$GITHUB_REPOSITORY"
